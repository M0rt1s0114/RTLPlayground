<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeSwitchOS · 带宽限速</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="style.css">
  <script src="/main.js"></script>
</head>
<body>
  <nav id="sidebar"></nav>
  <div class="main-wrap">
    <h1>入向 &amp; 出向带宽限速</h1>
    <div id="ports"></div>
    <table id="bwtable" style="width:100%;">
      <thead>
        <tr>
          <th rowspan="2">端口</th>
          <th colspan="3">入向（Ingress）</th>
          <th colspan="2">出向（Egress）</th>
          <th rowspan="2">应用</th>
        </tr>
        <tr><th>限速</th><th>带宽 [kbit/s]</th><th>流控</th><th>限速</th><th>带宽 [kbit/s]</th></tr>
      </thead>
    </table>
    <script src="/bandwidth.js"></script>
    <h2 style="margin-top:32px;">风暴控制（Storm Control）</h2>
    <p class="note">对广播 / 组播 / 未知单播 / 未知组播限速；单位 pps 或 kbit/s，限速值 0 表示关闭。</p>
    <table id="stormtable" style="width:100%;">
      <thead>
        <tr>
          <th rowspan="2">端口</th><th colspan="2">广播</th><th colspan="2">组播</th>
          <th colspan="2">未知单播</th><th colspan="2">未知组播</th><th rowspan="2">应用</th>
        </tr>
        <tr><th>上限</th><th>速率</th><th>上限</th><th>速率</th><th>上限</th><th>速率</th><th>上限</th><th>速率</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <script src="/navigation.js"></script>
</body>
</html>
