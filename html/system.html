<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeSwitchOS · 系统设置</title>
  <script src="/i18n.js"></script>
  <link rel="stylesheet" href="style.css">
  <script src="/main.js"></script>
</head>
<body>
  <nav id="sidebar"></nav>
  <div class="tab-bar">
    <button class="tab-btn active" onclick="openTab(event,'tab-system')">网络</button>
    <button class="tab-btn" onclick="openTab(event,'tab-advanced')">高级</button>
    <button class="tab-btn" onclick="openTab(event,'tab-console')">控制台</button>
  </div>
  <div class="main-wrap">
    <div id="ports"></div>

    <div id="tab-system" class="tab-content active">
      <h1>网络设置</h1>
      <div class="card" style="max-width:420px;">
        <div class="row"><div class="lcol"><label for="ip">IP 地址</label></div>
          <div class="rcol"><input id="ip" class="ip" type="text" minlength="7" maxlength="15" size="15" placeholder="192.168.1.1"></div></div>
        <div class="row"><div class="lcol"><label for="netmask">子网掩码</label></div>
          <div class="rcol"><input id="netmask" class="ip" type="text" minlength="7" maxlength="15" size="15" placeholder="255.255.255.0"></div></div>
        <div class="row"><div class="lcol"><label for="gw">默认网关</label></div>
          <div class="rcol"><input id="gw" class="ip" type="text" minlength="7" maxlength="15" size="15" placeholder="192.168.1.254"></div></div>
        <p class="note" style="margin-top:12px;">修改 IP 后请更新浏览器地址栏中的地址。</p>
        <div style="display:flex;gap:10px;margin-top:4px;">
          <button id="ip_sub" onclick="ipSub();">更新网络设置</button>
          <button id="dhcp_sub" onclick="dhcpSub();">通过 DHCP 获取地址</button>
          <p class="note" id="dhcp_status">—</p>
        </div>
      </div>
      <div class="card" style="margin-top:20px;max-width:420px;">
        <h2 style="margin-top:0;">主机名</h2>
        <div class="row"><div class="lcol"><label for="hostname">Hostname</label></div>
          <div class="rcol"><input id="hostname" type="text" maxlength="23" style="width:220px;"></div></div>
        <button id="hostname_sub" onclick="hostnameSub();">应用主机名</button>
      </div>
      <div class="card" style="margin-top:20px;max-width:420px;">
        <h2 style="margin-top:0;">Syslog</h2>
        <div class="row"><div class="lcol"><label for="syslog_en">启用</label></div>
          <div class="rcol"><input type="checkbox" id="syslog_en"></div></div>
        <div class="row"><div class="lcol"><label for="syslog_ip">服务器 IP</label></div>
          <div class="rcol"><input id="syslog_ip" type="text" style="width:160px;" placeholder="192.168.1.10"></div></div>
        <div class="row"><div class="lcol"><label for="syslog_port">端口</label></div>
          <div class="rcol"><input id="syslog_port" type="number" min="1" max="65535" style="width:100px;" placeholder="514"></div></div>
        <button id="syslog_sub" onclick="syslogSub();">应用 Syslog</button>
      </div>
      <div class="card" style="margin-top:20px;max-width:420px;">
        <h2 style="margin-top:0;">显示</h2>
        <div class="row"><div class="lcol"><label for="theme">主题</label></div>
          <div class="rcol"><select id="theme"></select></div></div>
        <div class="row"><div class="lcol"><label for="lang">语言</label></div>
          <div class="rcol"><select id="lang"></select></div></div>
        <p class="note">主题与语言只保存在当前浏览器。</p>
      </div>
      <div class="card" style="margin-top:20px;max-width:420px;">
        <h2 style="margin-top:0;">DNS</h2>
        <div class="row"><div class="lcol"><label for="dns1">DNS 服务器 1</label></div>
          <div class="rcol"><input id="dns1" type="text" style="width:160px;" placeholder="223.5.5.5"></div></div>
        <div class="row"><div class="lcol"><label for="dns2">DNS 服务器 2</label></div>
          <div class="rcol"><input id="dns2" type="text" style="width:160px;" placeholder="可选"></div></div>
        <p class="note" id="dns_dhcp">—</p>
        <button id="dns_sub" onclick="dnsSub();">应用 DNS</button>
      </div>
      <div class="card" style="margin-top:20px;max-width:420px;">
        <h2 style="margin-top:0;">时间 / NTP</h2>
        <div class="row"><div class="lcol"><label for="ntp_en">启用 NTP</label></div>
          <div class="rcol"><input type="checkbox" id="ntp_en"></div></div>
        <div class="row"><div class="lcol"><label for="ntp_server">NTP 服务器</label></div>
          <div class="rcol"><input id="ntp_server" type="text" style="width:220px;" placeholder="pool.ntp.org"></div></div>
        <div class="row"><div class="lcol"><label for="ntp_interval">同步间隔 [分钟]</label></div>
          <div class="rcol"><input id="ntp_interval" type="number" min="1" max="1440" style="width:100px;"></div></div>
        <div class="row"><div class="lcol"><label for="ntp_tz">时区</label></div>
          <div class="rcol"><input id="ntp_tz" type="text" style="width:100px;" placeholder="+08:00"></div></div>
        <div class="row"><div class="lcol"><label for="ntp_dst">夏令时</label></div>
          <div class="rcol"><select id="ntp_dst"><option value="off">关闭</option><option value="eu">欧洲</option><option value="us">美国</option></select></div></div>
        <p class="note">当前时间：<span id="ntp_now">—</span><br>状态：<span id="ntp_sync">—</span></p>
        <button id="ntp_sub" onclick="ntpSub();">应用 NTP</button>
      </div>
      <div class="card" style="margin-top:20px;max-width:420px;">
        <h2 style="margin-top:0;">会话超时</h2>
        <div class="row"><div class="lcol"><label for="session_timeout">超时 [秒]</label></div>
          <div class="rcol"><input id="session_timeout" type="number" min="1" max="65535" style="width:120px;"></div></div>
        <button onclick="sessionSub();">应用会话超时</button>
      </div>
      <div class="card" style="margin-top:20px;max-width:420px;">
        <h2 style="margin-top:0;">管理 MAC</h2>
        <div class="row"><div class="lcol"><label for="mac_addr">MAC 地址</label></div>
          <div class="rcol"><input id="mac_addr" type="text" style="width:170px;" placeholder="aa:bb:cc:dd:ee:ff"></div></div>
        <p class="note">修改后请用新 MAC 重新连接。</p>
        <button onclick="macSub();">应用 MAC</button>
      </div>
      <div class="card" style="margin-top:20px;max-width:420px;">
        <h2 style="margin-top:0;">Flash 存储</h2>
        <p class="note">将当前运行配置保存到 Flash 持久化存储。</p>
        <button id="flash_sub" onclick="flashSave();">保存配置到 Flash</button>
      </div>
    </div>

    <div id="tab-advanced" class="tab-content">
      <h1>高级设置</h1>
      <div class="card" style="max-width:640px;">
        <label style="font-size:12px;color:var(--mut);display:block;margin-bottom:8px;">启动配置</label>
        <textarea id="config_display" rows="10"></textarea>
        <p class="warn" style="margin-top:10px;">⚠ 写入格式错误的配置可能导致设备无法访问。</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;">
          <button id="clear_config" onclick="clearConfig();">清除配置</button>
          <button id="flash_startup_sub" onclick="flashStartupSave();">保存启动配置到 Flash</button>
          <button id="switch_reset" onclick="resetSwitch();" style="color:var(--red);border-color:var(--red);">重置交换机</button>
        </div>
      </div>
    </div>

    <div id="tab-console" class="tab-content">
      <h1>控制台</h1>
      <div class="card" style="max-width:640px;">
        <label style="font-size:12px;color:var(--mut);display:block;margin-bottom:8px;" for="console_cmd">命令</label>
        <div style="display:flex;gap:8px;">
          <input type="text" id="console_cmd" name="console_cmd" style="flex:1;" placeholder="例：port 1 auto">
          <button id="cmd_sub" onclick="cmdSub();">发送</button>
        </div>
        <p class="warn" style="margin-top:10px;">⚠ 输入错误命令可能导致设备无法访问。</p>
      </div>
    </div>
  </div>
  <script src="/system.js"></script>
  <script>
  function openTab(evt, id) {
    document.querySelectorAll('.tab-content').forEach(function(c){c.classList.remove('active');});
    document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
    document.getElementById(id).classList.add('active');
    evt.currentTarget.classList.add('active');
  }
  </script>
</body>
</html>
