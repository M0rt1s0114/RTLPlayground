<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeSwitchOS · 固件升级</title>
  <script src="/i18n.js"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 隐藏原生 file input，用自定义按钮代替 */
    .file-input-wrap { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
    .file-input-wrap input[type=file] { position:absolute; width:0; height:0; opacity:0; pointer-events:none; }
    .file-label {
      display:inline-flex; align-items:center; gap:6px;
      padding:6px 14px;
      background:var(--sur2); color:var(--txt);
      border:1px solid var(--bdr); border-radius:var(--r);
      font-family:var(--ui); font-size:13px; font-weight:500;
      cursor:pointer; transition:background .12s, border-color .12s;
      user-select:none;
    }
    .file-label:hover { background:var(--acc); border-color:var(--acc); color:#fff; }
    .file-label.selected { border-color:var(--grn); color:var(--grn); }
    #file-name {
      font-family:var(--mono); font-size:12px; color:var(--mut);
      max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
  </style>
</head>
<body>
  <nav id="sidebar"></nav>
  <div class="main-wrap">
    <h1>固件升级</h1>
    <div class="card" style="max-width:500px;">
      <p class="note" style="margin-bottom:16px;">
        选择 <code style="font-family:var(--mono);background:var(--sur2);padding:2px 6px;border-radius:4px;">.bin</code>
        格式的固件文件后点击"上传并刷入"。
      </p>
      <form enctype="multipart/form-data" action="/upload" method="POST" id="uploadForm">
        <div class="file-input-wrap">
          <label class="file-label" id="fileLabel" for="uploadedfile">&#128190; 选择固件文件</label>
          <input name="uploadedfile" type="file" accept=".bin" id="uploadedfile"
                 onchange="onFileChange(this)">
          <span id="file-name">未选择文件</span>
        </div>
        <p class="warn">⚠ 刷写过程中请勿断电，否则可能造成设备变砖。</p>
        <div style="margin-top:12px;">
          <input type="submit" id="submitBtn" value="上传并刷入固件" disabled
                 style="opacity:.4;cursor:not-allowed;">
        </div>
      </form>
    </div>
  </div>
  <script src="/navigation.js"></script>
  <script>
  function setFileUI(ok, msg) {
    var btn = document.getElementById('submitBtn');
    var status = document.getElementById('fw-status');
    if (!status) {
      status = document.createElement('p');
      status.id = 'fw-status';
      status.className = 'note';
      status.style.marginTop = '10px';
      document.querySelector('.card').appendChild(status);
    }
    status.textContent = msg || '';
    status.style.color = ok ? 'var(--grn)' : 'var(--red)';
    btn.disabled = !ok;
    btn.style.opacity = ok ? '1' : '.4';
    btn.style.cursor = ok ? 'pointer' : 'not-allowed';
  }

  async function onFileChange(input) {
    var label  = document.getElementById('fileLabel');
    var nameEl = document.getElementById('file-name');
    if (!input.files || input.files.length === 0) {
      nameEl.textContent = '未选择文件';
      label.classList.remove('selected');
      label.textContent = '📁 选择固件文件';
      return setFileUI(false, '');
    }
    var file = input.files[0];
    var name = file.name;
    nameEl.textContent = name;
    label.classList.add('selected');
    label.textContent = '✓ ' + name;
    setFileUI(false, '正在检查固件…');
    if (file.size > 1000000) return setFileUI(false, '✗ 固件过大（> 1 MB）');
    var info = {};
    try { info = await fetch('/information.json').then(function (r) { return r.json(); }); } catch (e) {}
    var buf = new Uint8Array(await file.arrayBuffer());
    if (buf.length < 1024) return setFileUI(false, '✗ 文件太小，不像固件镜像');
    if (info.hw_ver) {
      var needle = [];
      for (var i = 0; i < info.hw_ver.length; i++) needle.push(info.hw_ver.charCodeAt(i) & 0xff);
      needle.push(0);
      var found = false;
      outer: for (var p = 0; p + needle.length <= buf.length; p++) {
        for (var k = 0; k < needle.length; k++) if (buf[p + k] !== needle[k]) continue outer;
        found = true; break;
      }
      if (!found) return setFileUI(false, '✗ 这个固件不是为「' + info.hw_ver + '」构建的，型号不匹配');
    }
    setFileUI(true, '✓ 固件检查通过（' + Math.round(file.size / 1024) + ' KB）');
  }
  </script>
</body>
</html>
